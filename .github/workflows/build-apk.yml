name: Mesai Takvimi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle --no-daemon :app:assembleDebug

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Mesai-Takvimi.apk

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Mesai-Takvimi-APK
          path: Mesai-Takvimi.apk
          retention-days: 30
